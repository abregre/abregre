<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .crop-mark {
      stroke: #ff2d55;
      stroke-width: 1;
      stroke-linecap: square;
      fill: none;
      opacity: 0.75;
    }

    .typed-text {
      clip-path: inset(0 100% 0 0);
      animation: reveal 3s steps(40) 0.8s forwards;
    }
    @keyframes reveal {
      to { clip-path: inset(0 0% 0 0); }
    }

    .cursor-move {
      animation: move-cursor 3s steps(40) 0.8s forwards;
    }
    @keyframes move-cursor {
      from { transform: translateX(0); }
      to { transform: translateX(574px); }
    }

    .cursor-typing {
      animation: blink-typing 0.6s step-end infinite 0.8s, fade-out 0.01s 3.8s forwards;
    }
    @keyframes blink-typing {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fade-out {
      to { opacity: 0; }
    }

    .cursor-final {
      opacity: 0;
      animation: appear 0.01s 3.8s forwards, blink-final 0.8s step-end 3.81s infinite;
    }
    @keyframes appear {
      to { opacity: 1; }
    }
    @keyframes blink-final {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .subtitle {
      opacity: 0;
      animation: fade-in 0.5s 4.2s forwards;
    }
    @keyframes fade-in {
      to { opacity: 1; }
    }
  </style>

  <!-- Terminal window frame -->
  <rect x="20" y="20" width="800" height="160" rx="6" ry="6" fill="#0d0d13" stroke="#1a1a24" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="21" y="21" width="798" height="35" rx="5" ry="5" fill="#12121a"/>
  <rect x="21" y="44" width="798" height="12" fill="#12121a"/>
  <line x1="20" y1="56" x2="820" y2="56" stroke="#1a1a24" stroke-width="1"/>

  <!-- Window control dots -->
  <circle cx="44" cy="38" r="6" fill="#ff2d55"/>
  <circle cx="64" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="38" r="6" fill="#27c93f"/>

  <!-- Title text -->
  <text x="420" y="43" text-anchor="middle" class="mono" font-size="12" fill="#8c8c9c">vasilis@thess ~ %</text>

  <!-- Prompt $ > -->
  <text y="98" class="mono" font-size="14">
    <tspan x="48" fill="#9b6bff">$</tspan>
    <tspan fill="#e9e9f0"> </tspan>
    <tspan fill="#ff2d55">&gt;</tspan>
  </text>

  <!-- Typed text revealed via CSS clip-path -->
  <text x="84" y="98" class="mono typed-text" font-size="14" fill="#e9e9f0">Frontend Engineer turned product builder</text>

  <!-- Moving cursor (follows typing, fades when done) -->
  <text x="84" y="98" class="mono cursor-move cursor-typing" font-size="14" fill="#e9e9f0">█</text>

  <!-- Blinking cursor at final position -->
  <text x="658" y="98" class="mono cursor-final" font-size="14" fill="#e9e9f0">█</text>

  <!-- Subtitle (appears after typing) -->
  <text x="48" y="132" class="mono subtitle" font-size="12" fill="#8c8c9c">~ remote <tspan fill="#ff2d55">·</tspan> freelance <tspan fill="#ff2d55">·</tspan> thessaloniki, GR <tspan fill="#ff2d55">·</tspan> since 2016</text>

  <!-- Crop marks -->
  <polyline points="20,32 8,32 8,20 20,20" class="crop-mark" filter="url(#glow)"/>
  <polyline points="820,32 832,32 832,20 820,20" class="crop-mark" filter="url(#glow)"/>
  <polyline points="20,168 8,168 8,180 20,180" class="crop-mark" filter="url(#glow)"/>
  <polyline points="820,168 832,168 832,180 820,180" class="crop-mark" filter="url(#glow)"/>

</svg>

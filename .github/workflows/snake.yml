name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: abregre
          outputs: |
            assets/snake-dark.svg?color_snake=%239b6bff&color_dots=%230d0d13,%231a1a24,%233d1f45,%237a2955,%23ff2d55

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: assets/snake-dark.svg
